<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Main Event — gestisci la tua federazione di wrestling: roster, titoli, rivalità e match che si animano da soli."
    />
    <meta name="theme-color" content="#070a18" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070a18'/%3E%3Cpath d='M16 4l3.2 7.1 7.8.9-5.7 5.3 1.5 7.7-6.8-3.7-6.8 3.7 1.5-7.7-5.7-5.3 7.8-.9z' fill='%23e8b84b'/%3E%3C/svg%3E"
    />
    <title>Main Event</title>
    <script>
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("main-event-theme");
        } catch (e) {}
        if (!t) {
          t =
            window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
