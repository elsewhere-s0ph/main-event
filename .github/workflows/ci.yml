name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # ubuntu-latest sta migrando a Ubuntu 26 (notice del runner): immagine bloccata
    # su 24.04 finché la CI non è di nuovo stabile su latest.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Nota: nessun package-lock.json nella repo (sviluppo AI-assistito),
      # quindi npm install invece di npm ci.
      - name: Run npm install
        run: |
          set -o pipefail
          npm install 2>&1 | tee /tmp/install.log
      - name: Diagnostica install (errori in annotazioni)
        if: failure()
        run: tail -40 /tmp/install.log | while IFS= read -r l; do echo "::error::$l"; done
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
